# SPDX-License-Identifier: Apache-2.0
# Render Blueprint: one free web service serving the API and the web UI.
# The API runs the worker loop in-process when no queue is configured.
#
# Secrets (sync: false) are set in the Render dashboard:
#   DATABASE_URL — Neon pooled connection string
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   NEXUS_SECRETS_KEY, NEXUS_AUDIT_KEY — 64 hex chars each: openssl rand -hex 32

services:
  - type: web
    name: nexus
    runtime: docker
    dockerfilePath: ./infra/web/Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: true
    # Readiness, not liveness: the early health server answers /health while the app still loads,
    # so a deploy or restart would switch traffic to an instance that cannot serve yet.
    healthCheckPath: /health/ready
    envVars:
      # The service's own https://<name>.onrender.com URL, known once it exists.
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Requests arrive through Cloudflare, Render's edge and a local hop, so all three are
      # trusted to name the client; Cloudflare's ranges are www.cloudflare.com/ips-v4 and ips-v6.
      - key: NEXUS_TRUST_PROXY
        value: "loopback,uniquelocal,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      # Each audit export reads Postgres; hourly lets a free database suspend between runs.
      - key: AUDIT_EXPORT_INTERVAL_MS
        value: "3600000"
      - key: NEXUS_API_KEY
        generateValue: true
      - key: NEXUS_JWT_SECRET
        generateValue: true
      - key: NEXUS_SECRETS_KEY
        sync: false
      - key: NEXUS_AUDIT_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Account email through Resend; links use OAUTH_REDIRECT_BASE.
      - key: RESEND_API_KEY
        sync: false
      - key: NEXUS_MAIL_FROM
        sync: false

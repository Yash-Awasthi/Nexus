# SPDX-License-Identifier: Apache-2.0
name: Lint

on:
  pull_request:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The lockfile check diffs against the pull request's base branch, which a
          # shallow checkout does not have.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # A workspace package that lint, tsconfig or `tsc -b` cannot see is
      # unverified. The derived lists are only worth having if this fails when a
      # package is not in them.
      - run: node --test scripts/lint-targets.test.mjs
      # The repository's own rules, as tests: every workflow has a row saying what
      # it prevents, the lockfile and manifests move together, stable publishes
      # from a tag while previews take the `next` dist-tag, and every turbo job
      # restores its cache and reports its wall time.
      - run: node --test scripts/workflow-map.test.mjs scripts/lockfile-drift.test.mjs scripts/release-triggers.test.mjs scripts/ci-cache.test.mjs scripts/job-times.test.mjs scripts/required-checks.test.mjs scripts/seed-determinism.test.mjs scripts/coverage-floors.test.mjs scripts/e2e-waits.test.mjs scripts/audit-gate.test.mjs scripts/actions-pinned.test.mjs scripts/license-audit.test.mjs scripts/rotation-drill.test.mjs scripts/retention-policy.test.mjs scripts/migrations-forward-only.test.mjs scripts/backup-drill.test.mjs scripts/quickstart.test.mjs scripts/dead-code.test.mjs scripts/error-envelope.test.mjs scripts/route-types.test.mjs scripts/lib-inventory.test.mjs scripts/prerelease-audit.test.mjs scripts/lint-paths.test.mjs scripts/electron-current.test.mjs scripts/perf-budget.test.mjs scripts/bundle-budget.test.mjs
      # Licence audit: a strong copyleft dependency needs an ADR, a dependency that
      # declares no licence needs a decision, and NOTICE has to match both.
      - run: node scripts/license-audit.mjs
      # Migrations only go forward: a migration that drops or truncates something
      # needs an entry in .github/migration-exceptions.json naming an existing ADR.
      - run: node scripts/migrations-forward-only.mjs
      # A required status check that no job reports blocks every pull request.
      - run: node scripts/required-checks.mjs
      - run: node scripts/lockfile-drift.mjs --base "origin/${{ github.base_ref }}"
        if: github.event_name == 'pull_request'
      - run: pnpm format:check

  headers:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:headers
      - run: pnpm check:docs
      # Every document says which commit it was last true against, and the layer
      # diagrams are generated from the tree so they cannot describe a tree that is gone.
      - run: node scripts/docs-verified.mjs --check
      - run: node scripts/arch-diagrams.mjs --check
      # Dead code is a gate, not a report: an unused export is a promise nobody kept.
      - run: node scripts/dead-code.mjs
      # Route handlers are where untrusted input meets the domain: any/casts may only fall.
      - run: node scripts/route-types.mjs
      # 104 lib modules: every one in a domain, and every one named by a test.
      - run: node scripts/lib-inventory.mjs
      # A pre-release dependency is a decision someone has to own; a drifted entry fails.
      - run: node scripts/prerelease-audit.mjs --check
      # The desktop toolchain is pinned exactly; the record must match the pin.
      - run: node scripts/electron-current.mjs
      - run: pnpm check:release

  go:
    name: Go — fmt, vet, test, vuln
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/board
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Board service is Go, so none of the gates above cover it. The runner image
      # carries Go; `GOTOOLCHAIN=auto` lets `go.mod`'s own version directive win, so the
      # module decides the toolchain rather than the image happening to be new enough.
      - name: Toolchain
        env:
          GOTOOLCHAIN: auto
        run: go version && go env GOMOD
      # gofmt is not a suggestion: a file that is not formatted fails here, with the
      # list, because a reviewer should not be the formatter.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        env:
          GOTOOLCHAIN: auto
        run: go vet ./...
      - name: Build
        env:
          GOTOOLCHAIN: auto
        run: go build ./...
      - name: Test
        env:
          GOTOOLCHAIN: auto
        run: go test ./...
      # A known CVE in a transitive Go dependency is the same failure as in npm, and
      # the module graph is not covered by `pnpm audit`.
      - name: Vulnerable dependencies
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  baseline:
    name: Baseline facts (docs/STATUS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      # The workspace and spec counts in STATUS.md are generated. A new package,
      # app or service, or a spec that gained a route, fails here until the
      # block is regenerated with `pnpm baseline`. Test counts are recorded by
      # that command but not gated: they differ between runners.
      - run: pnpm baseline:check

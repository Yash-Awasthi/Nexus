# SPDX-License-Identifier: Apache-2.0
# The free Render instance sleeps after 15 idle minutes and takes about a minute to wake;
# a request every 10 minutes keeps it answering at once. The 750 free hours a month are
# shared by every service in the account, so it stays awake 05:30 to 00:30 IST (about
# 590 hours) and sleeps overnight.
name: Keep warm

on:
  schedule:
    - cron: "*/10 0-18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping readiness
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://nexus-iosc.onrender.com/health/ready -o /dev/null

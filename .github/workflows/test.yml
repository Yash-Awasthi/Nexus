# SPDX-License-Identifier: Apache-2.0
name: Test

on:
  pull_request:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7
        with:
          # --changed diffs against the PR base, which needs history.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true

      # Verify the committed dependency graph; never auto-heal it in CI.
      - run: pnpm install --frozen-lockfile

      # Run vp from the workspace root so the root vitest.config.ts controls
      # the include globs (packages/*/tests/**) rather than having each
      # per-package script inherit the root config from a subdirectory,
      # which would cause "No test files found" failures.
      - name: Run tests affected by the PR
        if: github.event_name == 'pull_request'
        run: pnpm exec vp test run --changed "origin/${{ github.base_ref }}"
        env:
          # Schema tests are type-only (no live queries), but the db client
          # throws at import time without DATABASE_URL.  A placeholder URL
          # satisfies the guard; no real connection is made.
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      - name: Run full unit suite with coverage
        if: github.event_name == 'push'
        run: pnpm exec vp test run --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      # The turbo graph is the release gate: every workspace test task, not
      # just the root include globs.
      - name: Run every workspace test task
        if: github.event_name == 'push'
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      # openapi.yaml is generated from the live route table, not hand-written.
      # A route added without regenerating it makes the published spec wrong,
      # which is the failure mode that left the previous spec at 21 paths.
      - name: Check openapi.yaml is in sync with the routes
        run: pnpm openapi:check
        env:
          # Unreachable on purpose: the spec needs the route table, not data.
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/nexus_ci

      # The SDK's types are generated from that spec and committed so every
      # consumer typechecks without a codegen step — which only holds while the
      # committed copy matches.
      - name: Check the generated API types are in sync with the spec
        run: pnpm types:check

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always() && github.event_name == 'push' && matrix.node == '26'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          # Coverage is written to the workspace root coverage/ dir when vitest
          # is run from root (not per-package coverage dirs).
          files: coverage/lcov.info,packages/*/coverage/lcov.info
          fail_ci_if_error: false

  app-suites:
    name: App package suites
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: pnpm install --frozen-lockfile

      # apps/api, apps/ui and apps/desktop each carry their own vitest config —
      # apps/api's setup file stubs pg and Redis for every file in the suite.
      # The root run excludes them for that reason, so without this job the API
      # route tests (the whole HTTP surface) would gate nothing.
      - name: API suite
        run: pnpm --filter @nexus/api test
        env:
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      - name: UI suite
        run: pnpm --filter @nexus/ui test

      - name: Desktop suite
        run: pnpm --filter @nexus/desktop test

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      # Playwright launches dist/main.js, not the TypeScript sources.
      - run: pnpm --filter @nexus/desktop build
      # The desktop shell serves the built UI from the local API; without this the
      # child process refuses to start and Playwright only sees a missing window.
      - run: pnpm --filter @nexus/ui build
      # Install scripts are blocked in pnpm-workspace.yaml, so the Electron binary is
      # fetched on first use. Do that here, outside the launch timeout.
      - run: pnpm --filter @nexus/desktop exec node -e "require('electron/install.js')"
      # The sandbox page's kernel section runs only when Docker answers; the image it
      # uses is pulled here so the test never waits on a download.
      - run: docker pull python:3.12-slim
      - run: xvfb-run -a pnpm --filter @nexus/desktop exec playwright test

  migrations:
    name: Concurrent migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run the concurrent migration test
        run: pnpm --filter @nexus/api exec vitest run tests/lib/migrate-concurrent.test.ts
        env:
          NEXUS_TEST_POSTGRES_URL: postgresql://nexus:nexus@localhost:5432/nexus_migrate
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_migrate

  e2e:
    name: E2E — signal pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Enable pgvector extension
        run: PGPASSWORD=nexus psql -h localhost -U nexus -d nexus_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply database schema
        working-directory: packages/db
        run: pnpm db:push --force
        env:
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_e2e
      - name: Run E2E signal pipeline tests
        run: pnpm --filter @nexus/worker test -- --reporter=verbose tests/e2e/
        env:
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_e2e

  browser:
    name: Browser E2E (offline, isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/e2e-server.test.mjs scripts/e2e-offline.test.mjs scripts/unit-offline.test.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  python:
    name: Python tests (nexus-ingest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - working-directory: services/ingest
        run: |
          uv sync --locked --extra dev
          uv run pytest --tb=short -q

# SPDX-License-Identifier: Apache-2.0
name: Test

on:
  pull_request:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --changed diffs against the PR base, which needs history.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true

      # Turbo caches task output in .turbo/cache; without restoring it every run
      # pays for the whole graph again. The key covers the inputs that decide the
      # task graph — turbo.json, the lockfile and every workspace manifest — so a
      # task or dependency change is a fresh key and a source-only change is a
      # full hit. On a manifest change the restore-key still returns the last
      # cache for this job; turbo drops the entries whose hashes no longer match.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-unit-${{ hashFiles('turbo.json', 'turbo.jsonc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/adapters/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node }}-unit-
            turbo-${{ runner.os }}-node${{ matrix.node }}-
      # Wall time is measured from here, so it includes checkout, install and
      # every suite in this job.
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
        shell: bash

      # Verify the committed dependency graph; never auto-heal it in CI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run vp from the workspace root so the root vitest.config.ts controls
      # the include globs (packages/*/tests/**) rather than having each
      # per-package script inherit the root config from a subdirectory,
      # which would cause "No test files found" failures.
      - name: Run tests affected by the PR
        if: github.event_name == 'pull_request'
        run: pnpm exec vp test run --changed "origin/${{ github.base_ref }}"
        env:
          # Schema tests are type-only (no live queries), but the db client
          # throws at import time without DATABASE_URL.  A placeholder URL
          # satisfies the guard; no real connection is made.
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      - name: Run full unit suite with coverage
        if: github.event_name == 'push'
        run: pnpm exec vp test run --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      # The turbo graph is the release gate: every workspace test task, not
      # just the root include globs.
      - name: Run every workspace test task
        if: github.event_name == 'push'
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      # openapi.yaml is generated from the live route table, not hand-written.
      # A route added without regenerating it makes the published spec wrong,
      # which is the failure mode that left the previous spec at 21 paths.
      - name: Check openapi.yaml is in sync with the routes
        run: pnpm openapi:check
        env:
          # Unreachable on purpose: the spec needs the route table, not data.
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/nexus_ci

      # The SDK's types are generated from that spec and committed so every
      # consumer typechecks without a codegen step — which only holds while the
      # committed copy matches.
      - name: Check the generated API types are in sync with the spec
        run: pnpm types:check

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: always() && github.event_name == 'push' && matrix.node == '26'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          # Coverage is written to the workspace root coverage/ dir when vitest
          # is run from root (not per-package coverage dirs).
          files: coverage/lcov.info,packages/*/coverage/lcov.info
          fail_ci_if_error: false

      # Per-package floors with a ratchet: a package cannot hide behind the global
      # threshold, and --record only ever raises a floor (a drop is a hand edit).
      - name: Coverage floors per package
        if: github.event_name == 'push'
        run: node scripts/coverage-floors.mjs --strict

      # Publishes this job's wall time into the run summary and fails on a 25%
      # regression against .github/job-times.json; no baseline means recorded only.
      - name: Job wall time
        if: always()
        shell: bash
        run: node scripts/job-times.mjs --job unit --started "$STARTED"

  offline:
    name: Offline boot (no Docker, no Ollama)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: pnpm install --frozen-lockfile

      # docs/DEPLOYMENT.md "Offline machine" claims the server boots on a bare laptop.
      # The test removes every network-shaped variable and asserts /health answers, so
      # an import that needs Docker or a model provider fails here instead of on a
      # user's machine. Deliberately no services: this job must not have them.
      - name: Boot with nothing reachable
        working-directory: apps/api
        run: ../../node_modules/.bin/vp test run tests/lib/offline-mode.test.ts

  seeded:
    name: Seeded determinism (same seed twice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      - run: pnpm install --frozen-lockfile

      # A test that passes only in one order is holding state it does not own.
      # Same seed twice means the same order, so any difference in the result is
      # nondeterminism the seed does not reach (wall-clock, Math.random, a shared
      # temp file) rather than shuffle noise. Double the suite, so it is a
      # separate job instead of a step in the unit matrix.
      - name: Run the suite twice at the same shuffle seed
        # Seed 1337 is the script default; repeating it here would only drift.
        run: node scripts/seed-determinism.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci
          CI: "true"

  app-suites:
    name: App package suites
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Turbo reaches a remote cache when both are set, and stays on the restore-cache
      # below when they are not — so this is an opt-in for a repository that has a
      # team, not a required secret. A cache hit is what makes a second pull request
      # that touches one app stop paying for the other two.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      # Same key inputs as the unit job; the scope keeps this job's cache its own
      # so one job's save cannot shadow another's, while the second restore-key
      # still borrows any turbo cache from the same OS and Node.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node26-apps-${{ hashFiles('turbo.json', 'turbo.jsonc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/adapters/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-node26-apps-
            turbo-${{ runner.os }}-node26-
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile

      # apps/api, apps/ui and apps/desktop each carry their own vitest config —
      # apps/api's setup file stubs pg and Redis for every file in the suite.
      # The root run excludes them for that reason, so without this job the API
      # route tests (the whole HTTP surface) would gate nothing.
      #
      # Through turbo rather than `pnpm --filter … test`: the task hash is the file
      # contents, so an app whose sources did not change is restored from the cache
      # instead of run again for the whole suite.
      - name: API, UI and desktop suites
        run: pnpm exec turbo run test --filter=@nexus/api --filter=@nexus/ui --filter=@nexus/desktop
        env:
          DATABASE_URL: postgresql://test:test@localhost/nexus_ci

      # Same 25% regression rule as the other timed jobs; `.turbo/cache` hits show up
      # here as a shorter wall time rather than as a claim in the docs.
      - name: Job wall time
        if: always()
        run: node scripts/job-times.mjs --job app-suites --started "$STARTED"

  desktop-e2e:
    name: Desktop E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      # Playwright launches dist/main.js, not the TypeScript sources.
      - run: pnpm --filter @nexus/desktop build
      # The desktop shell serves the built UI from the local API; without this the
      # child process refuses to start and Playwright only sees a missing window.
      - run: pnpm --filter @nexus/ui build
      # Install scripts are blocked in pnpm-workspace.yaml, so the Electron binary is
      # fetched on first use. Do that here, outside the launch timeout.
      - run: pnpm --filter @nexus/desktop exec node -e "require('electron/install.js')"
      # The sandbox page's kernel section runs only when Docker answers; the image it
      # uses is pulled here so the test never waits on a download.
      - run: docker pull python:3.12-slim
      - run: xvfb-run -a pnpm --filter @nexus/desktop exec playwright test

  migrations:
    name: Concurrent migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run the concurrent migration test
        run: pnpm --filter @nexus/api exec vitest run tests/lib/migrate-concurrent.test.ts
        env:
          NEXUS_TEST_POSTGRES_URL: postgresql://nexus:nexus@localhost:5432/nexus_migrate
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_migrate

  e2e:
    name: E2E — signal pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Enable pgvector extension
        run: PGPASSWORD=nexus psql -h localhost -U nexus -d nexus_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply database schema
        working-directory: packages/db
        run: pnpm db:push --force
        env:
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_e2e
      - name: Run E2E signal pipeline tests
        run: pnpm --filter @nexus/worker test -- --reporter=verbose tests/e2e/
        env:
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_e2e

  browser:
    name: Browser E2E (offline, isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: pnpm install --frozen-lockfile
      # `pnpm build` below is a turbo task, so the build output is restored from
      # this cache instead of rebuilt. Same key inputs as the other turbo jobs.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node26-browser-${{ hashFiles('turbo.json', 'turbo.jsonc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/adapters/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-node26-browser-
            turbo-${{ runner.os }}-node26-
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - run: node --test scripts/e2e-server.test.mjs scripts/e2e-offline.test.mjs scripts/unit-offline.test.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Job wall time
        if: always()
        run: node scripts/job-times.mjs --job browser --started "$STARTED"

  python:
    name: Python tests (nexus-ingest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - working-directory: services/ingest
        run: |
          uv sync --locked --extra dev
          uv run pytest --tb=short -q

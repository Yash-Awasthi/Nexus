# SPDX-License-Identifier: Apache-2.0
name: Docker Build & Push

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/nexus
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build matrix ─────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            image_suffix: api
          - service: worker
            dockerfile: apps/worker/Dockerfile
            image_suffix: worker
          - service: ingest
            dockerfile: services/ingest/Dockerfile
            image_suffix: ingest
          - service: ui
            dockerfile: apps/ui/Dockerfile
            image_suffix: ui
          - service: web
            dockerfile: infra/web/Dockerfile
            image_suffix: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Nexus ${{ matrix.service }}
            org.opencontainers.image.description=Nexus autonomous orchestration — ${{ matrix.service }} service
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          # SBOMs are release artifacts; generating them on every PR only slows the path.
          sbom: ${{ github.event_name != 'pull_request' }}

  # ── Untrusted-code image ──────────────────────────────────────────────────────
  sandbox:
    name: Build sandbox image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: infra/sandbox
          push: false
          load: true
          tags: nexus-sandbox:local
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Every runtime answers
        run: |
          docker run --rm --network=none nexus-sandbox:local node -e 'console.log("node ok")'
          docker run --rm --network=none nexus-sandbox:local tsx --version
          docker run --rm --network=none nexus-sandbox:local python3 -c 'print("python ok")'
          docker run --rm --network=none nexus-sandbox:local bash -c 'echo bash ok'
          docker run --rm --network=none nexus-sandbox:local go version
          docker run --rm --network=none nexus-sandbox:local rustc --version
          docker run --rm --network=none nexus-sandbox:local ruby -e 'puts "ruby ok"'

      - name: Runs as uid 1000 on a read-only rootfs
        run: |
          test "$(docker run --rm nexus-sandbox:local id -u)" = "1000"
          printf 'const n: number = 41 + 1; console.log("tsx", n);\n' > probe.ts
          docker run --rm --read-only \
            --tmpfs /nexus-scratch:rw,nosuid,nodev,size=64m,mode=1777 \
            --env=TMPDIR=/nexus-scratch --env=HOME=/nexus-scratch \
            --network=none -v "$PWD:/nexus-host-tmp:ro" \
            nexus-sandbox:local tsx /nexus-host-tmp/probe.ts
          docker run --rm --read-only \
            --tmpfs /nexus-scratch:rw,nosuid,nodev,size=64m,mode=1777 \
            --env=TMPDIR=/nexus-scratch --env=HOME=/nexus-scratch \
            --network=none nexus-sandbox:local python3 -c 'print("readonly ok")'

  # ── Compose smoke test ────────────────────────────────────────────────────────
  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start stack
        run: |
          docker compose up -d postgres redis
          docker compose up -d --build api worker ingest
          sleep 20

      - name: API health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sf http://localhost:3000/health && echo "ok" || echo "fail")
            [ "$STATUS" = "ok" ] && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          curl -sf http://localhost:3000/health/ready

      - name: Ingest health check
        run: curl -sf http://localhost:8000/health

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

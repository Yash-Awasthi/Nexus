# SPDX-License-Identifier: Apache-2.0
name: k6 Load Tests

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: API base URL (defaults to staging)
        default: "https://nexus-staging.internal"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - name: Run k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: infra/k6/smoke-test.js
          flags: --env BASE_URL=${{ github.event.inputs.target_url || 'http://localhost:3000' }} --env API_KEY=${{ secrets.NEXUS_API_KEY_STAGING }}

  load:
    name: Load test (nightly only)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7

      # No staging deployment configured means nothing to load-test; skip, don't fail.
      - name: Check for a staging target
        id: target
        env:
          STAGING_URL: ${{ secrets.NEXUS_STAGING_URL }}
        run: echo "set=$([ -n "$STAGING_URL" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # Load and duration come from the scenarios in the script; --vus/--duration here
      # would replace them with a default scenario the script does not define.
      - name: Run k6 load test
        if: steps.target.outputs.set == 'yes'
        uses: grafana/k6-action@v0.3.1
        with:
          filename: infra/k6/load-test.js
          flags: >
            --env BASE_URL=${{ secrets.NEXUS_STAGING_URL }}
            --env API_KEY=${{ secrets.NEXUS_API_KEY_STAGING }}

      - name: Upload results
        if: always() && steps.target.outputs.set == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: k6-results-${{ github.run_id }}
          path: summary.json

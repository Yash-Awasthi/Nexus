# SPDX-License-Identifier: Apache-2.0
name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  dependencies:
    name: Production dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      # Fails on a high or critical advisory in what ships; lower ones are reviewed by hand.
      - run: pnpm audit --prod --audit-level high

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Override the auto-computed push range (before^..after). After a
          # history rewrite/squash the root commit has no parent, so the
          # default range "root^..HEAD" produces a fatal git error even when
          # no secrets exist. Scanning --all covers the full (now 8-commit)
          # history on every run, which is cheap and correct.
          GITLEAKS_LOG_OPTS: "--all --no-merges --first-parent"

  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Lockfiles, manifests and IaC. Fixed findings are the ones a bump can clear.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          timeout: 15m
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

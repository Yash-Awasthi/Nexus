# SPDX-License-Identifier: Apache-2.0
# npm publish — preview only, manual. Requires NPM_TOKEN secret.
#
# This is the PREVIEW path: it publishes under the `next` dist-tag, so `npm i`
# still installs the stable version. Stable releases come from release.yml, which
# publishes `latest` from a `v*` tag on master and nowhere else.
#
# What this publishes:
#   @nexus/cli      — nexus CLI (apps/cli)
#   @nexus/billing  — Stripe billing helpers (packages/billing)
#   @nexus/llm      — LLM drivers, routing, registry, budget, compression (packages/llm)
#   @nexus/council  — debate engine, best-of-n, gauntlet (packages/council)
#   @nexus/search   — retrieval, hybrid search, GraphRAG, KG, reranker (packages/search)
#   @nexus/agent-core — agents, engine, runtime kernel, workflow, STM (packages/agent-core)
#
# `@nexus/gateway-log` used to be here and is now `apps/api/src/lib/gateway-log.ts`: it had one
# importer and no dependencies, so the package boundary only cost a `package.json` to keep in sync
# (`docs/ARCHITECTURE.md` § "Packages with one consumer"). Its last published version stays on npm;
# nothing here publishes it again.
#
# Secrets required (set in repo settings → Secrets → Actions):
#   NPM_TOKEN — npm automation token (read+write, no MFA)
#
# Trigger: workflow_dispatch only (prevents spurious fires on package.json edits)
name: npm Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (leave blank for all changed)"
        required: false

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo caches task output in .turbo/cache; without restoring it a manual
      # publish rebuilds the whole graph.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-node26-
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test --filter="./packages/*"

      - name: Publish changed packages as a preview (next tag)
        # `--tag next`, never `latest`: a manual run must not move what `npm i`
        # installs. release.yml owns `latest`, and only from a tag on master.
        run: pnpm changeset publish --no-git-tag --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Tag published versions
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          pnpm changeset tag
          git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes this job's wall time; fails on a 25% regression once
      # .github/job-times.json carries a baseline for it.
      - name: Job wall time
        if: always()
        run: node scripts/job-times.mjs --job npm-publish --started "$STARTED"

  notify:
    name: Post-publish notification
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    steps:
      - name: Summary
        run: |
          echo "## Packages published successfully" >> $GITHUB_STEP_SUMMARY
          echo "Published at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "Registry: https://registry.npmjs.org" >> $GITHUB_STEP_SUMMARY

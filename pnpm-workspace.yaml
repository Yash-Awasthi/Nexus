# SPDX-License-Identifier: Apache-2.0
packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"

# One version per tool across all workspace packages: `"typescript": "catalog:"`.
catalog:
  "@neondatabase/serverless": ^0.10.4
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@playwright/test": 1.64.0
  "@types/node": ^26.6.5
  "@types/pg": ^8.23.1
  # TypeScript 7 provides `tsc`; tools that import the compiler API
  # (typescript-eslint, openapi-typescript, knip) get the 6.0 API under the
  # `typescript` name, as the TypeScript 7 release recommends.
  "@typescript/native": npm:typescript@7.0.2
  typescript: npm:@typescript/typescript6@^6.0.2
  "@vitest/coverage-v8": 5.0.4
  bullmq: ^5.81.5
  drizzle-orm: ^0.45.4
  fast-check: ^4.10.2
  fastify: ^5.12.5
  ioredis: ^5.11.1
  pg: ^8.23.1
  playwright-core: 1.64.0
  vitest: 5.0.4

engineStrict: true
strictPeerDependencies: false
autoInstallPeers: true
shamefullyHoist: true
# Packages resolve ESLint plugins, Prettier and Vitest from the root config.
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "@vitest*"

# Install scripts run only for packages listed true; native binaries need them.
allowBuilds:
  core-js: false
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: false
  sharp: true
  tesseract.js: false
  unrs-resolver: false
  workerd: true
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.71.2"
  - "@typescript-eslint/parser@8.71.2"
  - "@typescript-eslint/project-service@8.71.2"
  - "@typescript-eslint/scope-manager@8.71.2"
  - "@typescript-eslint/tsconfig-utils@8.71.2"
  - "@typescript-eslint/type-utils@8.71.2"
  - "@typescript-eslint/types@8.71.2"
  - "@typescript-eslint/typescript-estree@8.71.2"
  - "@typescript-eslint/utils@8.71.2"
  - "@typescript-eslint/visitor-keys@8.71.2"
  - typescript-eslint@8.71.2
  - "@vitest/coverage-v8@5.0.4"
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - vitest@5.0.4
  - "@electric-sql/pglite@0.5.9"
  - "@radix-ui/primitive@1.2.0"
  - "@radix-ui/react-accessible-icon@1.2.0"

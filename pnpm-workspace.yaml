# SPDX-License-Identifier: Apache-2.0
packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"

# One version per tool across all workspace packages: `"typescript": "catalog:"`.
catalog:
  "@types/node": ^26.6.5
  "@vitest/coverage-v8": ^2.1.9
  typescript: 7.0.2
  vitest: ^2.1.9

catalogs:
  # openapi-typescript prints its output with the TypeScript 5 compiler API,
  # which TypeScript 7 no longer ships; @nexus/contracts provides it as the peer.
  openapi:
    typescript: ^5.9.3

engineStrict: true
strictPeerDependencies: false
autoInstallPeers: true
shamefullyHoist: true
# Packages resolve ESLint plugins, Prettier and Vitest from the root config.
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "@vitest*"

# Install scripts run only for packages listed true; native binaries need them.
allowBuilds:
  core-js: false
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: false
  sharp: true
  tesseract.js: false
  workerd: true

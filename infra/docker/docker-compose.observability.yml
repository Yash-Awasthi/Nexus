# docker-compose.observability.yml — Local observability stack
#
# Usage:
#   docker compose \
#     -f docker-compose.yml \
#     -f infra/docker/docker-compose.observability.yml \
#     --profile observability up
#
# Adds:
#   - OpenTelemetry Collector (OTLP gRPC :4317, HTTP :4318)
#   - Prometheus (scrapes OTel + direct service metrics) at :9090
#   - Grafana (pre-configured datasources) at :3010
#   - Jaeger (trace UI) at :16686
#
# Including this file is the opt-in: plain `docker compose up` on the base file starts none of it.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: !reset []
    restart: unless-stopped
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:8888:8888" # Collector self-metrics
      - "127.0.0.1:8889:8889" # Prometheus exporter

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: !reset []
    restart: unless-stopped
    volumes:
      - ./infra/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: !reset []
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: nexus-dev
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/nexus.yaml:ro
      - ./infra/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/nexus.yaml:ro
      - ./infra/grafana/provisioning/alerting/rules.yml:/etc/grafana/provisioning/alerting/nexus-rules.yaml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3010:3000"

  jaeger:
    # Jaeger v2 is built on the OTel Collector: it takes OTLP on 4317 by default.
    image: jaegertracing/jaeger:2.22.0
    profiles: !reset []
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI

  # Wire existing services to emit telemetry
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nexus-api
      OTEL_TRACES_EXPORTER: otlp
      # Allow Prometheus to scrape /api/v1/metrics without a Bearer token in local dev.
      # Remove or set to false in production — use bearer_token in prometheus.yml instead.
      METRICS_NO_AUTH: "true"

  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nexus-worker
      OTEL_TRACES_EXPORTER: otlp

  ingest:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nexus-ingest
      OTEL_TRACES_EXPORTER: otlp

volumes:
  prometheus-data:
  grafana-data:

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "nexus-ingest"
version = "0.0.0"
description = "Nexus ingest service — financial scraping + analysis (ex-FinScrape)"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.15.0",
  "httpx>=0.28.1",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp>=1.45.1",
  "prometheus-client>=0.26.0",
  "redis[hiredis]>=8.1.0",
  "asyncpg>=0.32.0",
  "celery[redis]>=5.6.3",
]
# finscrape is a local sibling repo, left out of the lock; for local dev run
#   uv pip install -e ../../../fin-scrape
# CI and the image skip it; scraper endpoints degrade gracefully when absent.
[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "hypothesis>=6.169.0",
  "schemathesis>=4.31.0",
  "mypy>=2.4.0",
  "ruff==0.17.0",
]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
python_version = "3.14"
[tool.pytest.ini_options]
asyncio_mode = "auto"


<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ask Nexus</title>
    <style>
      body {
        width: 380px;
        margin: 0;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      form {
        display: grid;
        gap: 8px;
        padding: 14px;
      }
      input {
        padding: 6px 8px;
        font: inherit;
      }
      nexus-widget {
        display: block;
        height: 500px;
      }
      .reset {
        border: 0;
        background: none;
        color: #6b7280;
        font-size: 12px;
        cursor: pointer;
        padding: 4px 14px 8px;
      }
    </style>
  </head>
  <body>
    <form id="settings" hidden>
      <strong>Connect to Nexus</strong>
      <label
        >Nexus address <input id="api" type="url" required placeholder="http://localhost:3000"
      /></label>
      <label>API token (search scope) <input id="token" required placeholder="nxk_..." /></label>
      <button type="submit">Save</button>
    </form>
    <div id="ask"></div>
    <button class="reset" id="reset" hidden>Change server or token</button>
    <script src="widget.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

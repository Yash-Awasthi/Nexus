<!doctype html>
<!--
  SPDX-License-Identifier: Apache-2.0
  The offline shell: what the service worker serves when a navigation cannot reach the network
  and the page is not one of the cached read-only ones.

  It is a static file on purpose. The app's own shell is a React tree that needs its data; this
  page needs nothing but itself, so it works on a plane, on a dead hotel wifi, and during the
  thirty seconds a deploy is restarting the API.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Nexus</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #18181b;
        --bg: #ffffff;
        --muted: #6b7280;
        --line: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #fafafa;
          --bg: #09090b;
          --muted: #a1a1aa;
          --line: #27272a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 30rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1rem;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0 0 1.5rem;
        border-top: 1px solid var(--line);
      }
      li {
        border-bottom: 1px solid var(--line);
      }
      a {
        display: flex;
        justify-content: space-between;
        padding: 0.6rem 0;
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        color: var(--fg);
      }
      .hint {
        font-size: 13px;
      }
      button {
        font: inherit;
        padding: 0.5rem 0.9rem;
        border-radius: 0.5rem;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Nexus needs a connection to run a council or a workflow. These pages still open from the
        cache, read-only:
      </p>
      <ul>
        <li><a href="/dashboard">Home <span aria-hidden="true">→</span></a></li>
        <li><a href="/discussion">Discussion <span aria-hidden="true">→</span></a></li>
        <li><a href="/settings">Preferences <span aria-hidden="true">→</span></a></li>
      </ul>
      <p class="hint">
        Anything you typed is kept in this tab. Reconnect and press retry — nothing was sent, so
        nothing was half-sent.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The status page reads the API's /health and /health/ready (as vercel.json routes them).
    location /health {
        access_log off;
        proxy_pass ${NEXUS_API_INTERNAL_URL}/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy /api/* → Nexus API backend.
    # NEXUS_API_INTERNAL_URL must be a full origin (scheme+host+port), e.g.
    #   http://nexus-api.railway.internal:10000   (Railway private networking)
    # Substituted at container start by the nginx image's envsubst step — this
    # file is installed as a .template (see apps/ui/Dockerfile). nginx has no
    # ${VAR:-default} syntax, so the value MUST be set in the deploy env.
    # Stream channels (watch links) are WebSockets and need the upgrade headers.
    location /api/ws/ {
        proxy_pass ${NEXUS_API_INTERNAL_URL}/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass ${NEXUS_API_INTERNAL_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE support — disable buffering for /api/*/stream endpoints
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # The OpenAI-compatible API, so clients can use this origin + /v1 as their base URL.
    location /v1/ {
        proxy_pass ${NEXUS_API_INTERNAL_URL}/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — serve index.html for all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
